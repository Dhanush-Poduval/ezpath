[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accessible-routing"
version = "0.2.0"
description = "Constraint-first accessible pedestrian routing engine"
requires-python = ">=3.10"
dependencies = ["osmnx>=2.0,<3.0", "networkx>=3.2", "numpy>=1.26"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
