openapi: 3.1.0
info:
  title: EzPath Routing API
  version: 0.1.0
  description: >-
    Versioned boundary between the EzPath browser applications and the
    deterministic accessibility-routing service. The first implementation
    supports the bounded walking graph; multimodal fields will be added only
    after the routing core supports them.
servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com
    variables:
      apiId:
        default: example
      region:
        default: ap-south-1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service and graph health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/routes:
    post:
      operationId: createRoute
      summary: Find accessibility-aware walking-route alternatives
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteRequest"
      responses:
        "200":
          description: Route search completed, including a valid no-route result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResponse"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Coordinates cannot be snapped within the requested limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    RouteRequest:
      $ref: ../traversal/routing/contracts/route-request.schema.json
    RouteResponse:
      $ref: ../traversal/routing/contracts/route-response.schema.json
    HealthResponse:
      type: object
      required: [status, graph_version]
      properties:
        status:
          type: string
        graph_version:
          type: string
        nodes:
          type: integer
        edges:
          type: integer
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
